repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: \.(py)$

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: python -m pylint --rcfile=.pylintrc web_app
        language: system
        types: [python]
        files: ^web_app/.*\.py$

      - id: mypy
        name: mypy
        entry: python -m mypy web_app
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
